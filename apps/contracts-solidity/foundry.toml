[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@chainlink/policy-management/=lib/chainlink-ace/packages/policy-management/src/",
  "@chainlink/cross-chain-identity/=lib/chainlink-ace/packages/cross-chain-identity/src/",
  "forge-std/=lib/forge-std/src/"
]

[fmt]
line_length = 100

[etherscan]
arbitrum-sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614, url = "https://api.etherscan.io/v2/api" }

[rpc_endpoints]
arbitrum-sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
